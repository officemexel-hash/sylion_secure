name: Terraform Plan

on:
  pull_request:
    paths:
      - 'infrastructure/terraform/**'
      - '.github/workflows/terraform-plan.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: tf-plan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan (${{ matrix.env }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        env: [lab]
        # Production plan runs only on push to main via terraform-apply.yml
        # Add: env: [lab, staging] when staging env exists

    defaults:
      run:
        working-directory: infrastructure/terraform/environments/${{ matrix.env }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.7.0"
          terraform_wrapper: true

      - name: Terraform format check
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform init (no backend)
        run: |
          # Plan does not need backend state — use local
          terraform init -backend=false

      - name: Terraform validate
        run: terraform validate -no-color

      - name: Terraform plan
        id: plan
        env:
          # No real cloud credentials needed for plan-only with dummy data
          # Real apply uses secrets in terraform-apply.yml
          TF_VAR_environment: ${{ matrix.env }}
        run: |
          terraform plan -no-color -input=false -lock=false 2>&1 | tee plan-output.txt
        continue-on-error: true

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PLAN_OUTPUT: ${{ steps.plan.outputs.stdout }}
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('infrastructure/terraform/environments/${{ matrix.env }}/plan-output.txt', 'utf8');
            const truncated = output.length > 60000 ? output.substring(0, 60000) + '\n... (truncated)' : output;
            const body = `### Terraform Plan — \`${{ matrix.env }}\`

            <details>
            <summary>Show plan</summary>

            \`\`\`hcl
            ${truncated}
            \`\`\`

            </details>

            **Format check**: ${{ steps.fmt.outcome }}
            **Plan status**: ${{ steps.plan.outcome }}`;
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

      - name: Fail if format or validate failed
        if: steps.fmt.outcome == 'failure' || steps.plan.outcome == 'failure'
        run: |
          echo "Terraform fmt or validate failed"
          exit 1
